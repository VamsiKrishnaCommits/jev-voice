name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e 'packages/python[webrtc,test,demo]'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: .venv/bin/python -m pytest packages/python/tests -q
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
