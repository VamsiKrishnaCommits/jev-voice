[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-voice"
version = "0.3.0"
description = "Voice agents with pluggable turn taking and a WebRTC server adapter"
requires-python = ">=3.11,<3.14"
dependencies = ["pipecat-ai==1.11.0", "aiohttp>=3.11,<4"]

[project.optional-dependencies]
webrtc = ["pipecat-ai[webrtc,elevenlabs,silero]==1.11.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest", "pytest-asyncio", "httpx"]
demo = ["python-dotenv"]
livekit = ["livekit-agents==1.8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
